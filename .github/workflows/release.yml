# EvoResearch 云端构建（Windows / Linux / macOS 桌面 + Android APK + iOS）。
#
# 版本固定策略：Release 始终为「EvoResearch v0.1.0-rc.1」（tag v0.1.0-rc.1）。
# tag 已存在时：删除远端旧 tag 与旧 Release 后重建，tauri-action / gh release
# 以 `clobber` 语义覆盖同名资产 —— 即"自动覆盖更新资产"。
#
# 触发模式（联调开关）：
#   iOS 联调期：push 到 main 自动触发，且只跑 ios job（desktop/android 临时
#   禁用——它们已验证通过，跳过可把单轮反馈周期从 ~40min 压到 ~15min）。
#   联调完成后：恢复 workflow_dispatch 手动触发并重新启用 desktop/android。
#
# 说明：
# - macOS 使用 Ad-hoc 签名（本地可启动）；如需分发签名见 docs/05-release-ci.md；
# - Release Notes 由 publish-notes 步骤按固定模板生成（平台下载表 +
#   卖点简介 + 自动提取的 commit 摘要），非 draft 直接正式发布。

name: Release EvoResearch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 同一时刻只跑一条流水线：上一轮未结束时新一轮排队（不取消在跑的），
# 避免 prepare-release 删 Release 时上一轮 desktop job 还在传资产（404 竞态）
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

env:
  APP_NAME: EvoResearch
  TAG: v0.1.0-rc.1
  RELEASE_NAME: EvoResearch v0.1.0-rc.1

jobs:
  # ── 固定版本号：确保 tag/Release 存在；已存在则删除重建（覆盖资产）──────────
  # iOS 联调期（IOS_ONLY=true）跳过 Release 删除重建，只验证 iOS 编译本身
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.release_id }}
      ios_only: ${{ steps.mode.outputs.ios_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 判定运行模式（iOS 联调开关 IOS_ONLY）
        id: mode
        run: |
          # 联调开关：改这一行即可。true = 只跑 iOS job；false = 全平台完整发布
          echo "ios_only=true" >> "$GITHUB_OUTPUT"

      - name: 跳过 Release 管理（iOS 联调模式）
        if: steps.mode.outputs.ios_only == 'true'
        run: echo "iOS 联调模式：不创建/删除 Release，仅验证 iOS 编译"

      - name: 删除已存在的同名 Tag 与 Release（覆盖更新）
        if: steps.mode.outputs.ios_only != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 删除旧 Release（若存在）——404 输出非数字，视为无旧 Release
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id' 2>/dev/null || true)
          case "$RELEASE_ID" in
            ''|*[!0-9]*) echo "无旧 Release，跳过删除" ;;
            *)
              echo "删除旧 Release id=$RELEASE_ID"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID"
              ;;
          esac
          # 删除旧 Tag（remote 与 local）
          git push origin ":refs/tags/${TAG}" 2>/dev/null || echo "远端无旧 tag"

      - name: 创建 Release（EvoResearch v0.1.0-rc.1，非 draft）
        id: create_release
        if: steps.mode.outputs.ios_only != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 用当前 main HEAD 重新打 tag（覆盖语义：始终指向最新一次触发）
          git tag -f "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"
          RELEASE_JSON=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
            -F tag_name="${TAG}" \
            -f target_commitish="${GITHUB_SHA}" \
            -f name="${RELEASE_NAME}" \
            -F draft=false \
            -F prerelease=true \
            -f body="$(cat <<'NOTES'
          Release notes 生成中——构建完成后由 publish-notes 步骤写入完整模板。
          NOTES
          )")
          RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id')
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  # ── Desktop：Windows / Linux / macOS 并行编译 ────────────────────────────
  desktop:
    needs: [prepare-release]
    # iOS 联调期跳过（desktop 三平台已验证通过）；联调完成删掉此 if 即恢复
    if: needs.prepare-release.outputs.ios_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targets: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: macos-latest
            targets: aarch64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装 Rust（stable）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Linux：Tauri 依赖的系统库（webkit2gtk 等）
      # 注意：libappindicator3-dev 与 libayatana-appindicator3-dev 互斥（Conflicts），
      # 只装 ayatana 版（Ubuntu 22.04+ runner 的 webkit2gtk-4.1 栈配套）
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libfuse2

      # linuxdeploy 本身是 AppImage：双保险——EXTRACT_AND_RUN 自解压 + libfuse2
      # 兜底（部分 linuxdeploy 构建即使自解压也需要 /dev/fuse 存在）
      - name: AppImage 工具免 FUSE 运行
        if: runner.os == 'Linux'
        run: |
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          # tauri-bundler 在 Error 日志级别下会吞掉 linuxdeploy 的 stderr，
          # 只回 "failed to run linuxdeploy"；调到 debug 级别让真实错误透出
          echo "TAURI_BUNDLER_LOG_LEVEL=debug" >> "$GITHUB_ENV"
          echo "RUST_LOG=debug" >> "$GITHUB_ENV"

      # Tauri CLI：优先用 npm 版（免编译，~30s）；cargo install 要 6 分钟+
      - name: 安装 Tauri CLI
        run: npm i -g @tauri-apps/cli@'^2'

      # 前端/插件产物（sidecar 组装需要 packages/*/lib、evoresearch-app/dist）
      - name: 构建工作区（插件 + Web 资源）
        shell: bash
        run: |
          npm ci
          npm run build

      # sidecar 组装（Node 二进制按 runner 平台下载；CI 内无需缓存加速参数）
      - name: 组装 Node sidecar
        shell: bash
        run: node desktop/scripts/bundle-sidecar.mjs

      # frontendDist ../dist 占位页（真实 UI 由 sidecar 运行期提供；desktop/dist
      # 被 .gitignore 的 dist/ 规则覆盖，需从入库的 dist.placeholder 复制）
      - name: 生成 frontendDist 占位页
        shell: bash
        run: mkdir -p desktop/dist && cp desktop/dist.placeholder/index.html desktop/dist/index.html

      - name: 清理 tauri 资源残留目录
        shell: bash
        run: rm -rf desktop/src-tauri/target/release/_up_

      - name: Tauri 桌面构建（tauri-action 上传到 Release）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS Ad-hoc 签名（未配置证书时保证产物本地可用）
          APPLE_SIGNING_IDENTITY: '-'
          # -v：bundler 在 Error 级别会吞掉 linuxdeploy 的 stderr，verbose 让其透出
          TAURI_CLI_VERBOSE: 2
        with:
          projectPath: desktop
          tagName: ${{ env.TAG }}
          releaseName: ${{ env.RELEASE_NAME }}
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          args: --verbose --target ${{ matrix.targets }} --bundles ${{ matrix.bundles }}

  # ── Android：交叉编译 APK（unsigned；有签名密钥则自动签名）───────────────
  android:
    needs: [prepare-release]
    # iOS 联调期跳过（Android 已验证通过）；联调完成删掉此 if 即恢复
    if: needs.prepare-release.outputs.ios_only != 'true'
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装 Rust 与 Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Android SDK 由 ubuntu-latest 预装（ANDROID_HOME 已设置）；补 NDK
      - name: 安装 Android SDK 组件
        run: |
          # ubuntu-latest 预装 cmdline-tools 不在 PATH 上，用绝对路径调用 sdkmanager
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "ndk;26.3.11579264" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      # Tauri CLI：npm 版免编译（cargo install 要 6 分钟+）
      - name: 安装 Tauri CLI
        run: npm i -g @tauri-apps/cli@'^2'

      - name: 构建工作区（插件 + Web 资源）
        run: |
          npm ci
          npm run build

      # frontendDist ../dist 占位页（Android 不跑 Node sidecar，壳加载内置页）
      - name: 生成 frontendDist 占位页
        run: mkdir -p desktop/dist && cp desktop/dist.placeholder/index.html desktop/dist/index.html

      - name: 初始化 Android 工程（gen/android 不入库）
        working-directory: desktop/src-tauri
        run: cargo tauri android init || echo "gen/android 已存在"

      - name: Tauri Android 构建（APK，--config 套用 android 配置）
        working-directory: desktop/src-tauri
        run: |
          CONFIG_ARGS="--config tauri.android.conf.json"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            export TAURI_ANDROID_KEY_STORE_FILE="$RUNNER_TEMP/keystore.jks"
            export TAURI_ANDROID_KEY_STORE_PASSWORD="$KEYSTORE_PASSWORD"
            export TAURI_ANDROID_KEY_ALIAS="$KEY_ALIAS"
            export TAURI_ANDROID_KEY_PRIVATE_KEY_PASSWORD="$KEY_PASSWORD"
            echo "::notice::使用 secrets 中的 keystore 签名 APK"
          else
            echo "::notice::未配置签名密钥（ANDROID_KEYSTORE_BASE64 等 secrets），产出 unsigned/debug APK"
          fi
          cargo tauri android build --apk --split-per-abi $CONFIG_ARGS

      - name: 收集 APK 产物
        id: collect_apks
        run: |
          mkdir -p apks
          find desktop/src-tauri/gen/android -name "*.apk" -exec cp {} apks/ \;
          ls -la apks/

      - name: 上传 APK 到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in apks/*.apk; do
            [ -e "$f" ] || continue
            echo "上传 $f → ${TAG}"
            gh release upload "${TAG}" "$f" --repo "${GITHUB_REPOSITORY}" --clobber
          done

  # ── iOS：Xcode 云端编译（.app 产物 + 可选 IPA）────────────────────────────
  # 无 Apple 开发者账号/证书时：Xcode 默认对模拟器/本机签名（CODE_SIGNING_ALLOWED
  # 对模拟器不强制），产物用于验证编译链路；真机分发需后续配证书。
  ios:
    needs: [prepare-release]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装 Rust 与 iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: 安装 Tauri CLI
        run: npm i -g @tauri-apps/cli@'^2'

      - name: 构建工作区（插件 + Web 资源）
        run: |
          npm ci
          npm run build

      # frontendDist ../dist 占位页（iOS 同 Android：不跑 Node sidecar，壳加载内置页）
      - name: 生成 frontendDist 占位页
        run: mkdir -p desktop/dist && cp desktop/dist.placeholder/index.html desktop/dist/index.html

      # gen/apple 不入库：在 runner 上现场生成。npm 版 CLI 经 npx 调用
      # （cargo tauri 子命令需要 cargo-tauri 二进制，npm 版用 `npx tauri` 入口）
      - name: 初始化 iOS 工程
        working-directory: desktop/src-tauri
        run: npx tauri ios init

      - name: Tauri iOS 构建（iOS 模拟器 + 真机架构）
        working-directory: desktop/src-tauri
        run: |
          # tauri.ios.conf.json：resources 清空（Node sidecar 不进移动包）；
          # tauri ios build 的 --target 用短名（aarch64/aarch64-sim/x86_64）；
          # 模拟器 target 不要求签名；真机 target 无证书时允许跳过签名
          npx tauri ios build --target aarch64-sim --config tauri.ios.conf.json
          npx tauri ios build --target aarch64 --config tauri.ios.conf.json \
            || echo "::warning::真机 target 构建失败（无签名证书时常见）；模拟器产物已验证编译链路"

      - name: 收集 iOS 产物
        run: |
          mkdir -p ios-artifacts
          find desktop/src-tauri/gen/apple -name "*.app" -type d 2>/dev/null | while read -r app; do
            zip -r -q "ios-artifacts/$(basename "$app").zip" "$app"
          done
          ls -la ios-artifacts/

      - name: 上传 iOS 产物（workflow artifact，联调期不进 Release）
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ios-artifacts/*.zip
          if-no-files-found: warn

  # ── 发布说明：全部产物上传完成后，按固定模板写入 Release body ──────────────
  # 模板：平台下载表（首推 Windows）+ 卖点简介 + 自动提取的 commit 变更摘要。
  publish-notes:
    needs: [desktop, android]
    if: ${{ !cancelled() && needs.desktop.result == 'success' && needs.prepare-release.outputs.ios_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（取 commit 历史生成变更摘要）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成并写入 Release Notes（固定模板）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # ── 变更摘要：相对上一个 tag 的 commit 首行（过滤 CI 调试噪音）──
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "${TAG}" ]; then
            RANGE="${PREV_TAG}..${GITHUB_SHA}"
          else
            RANGE="-30 ${GITHUB_SHA}"
          fi
          CHANGES=$(git log --no-merges --format='- %s' ${RANGE} \
            | grep -vE '^- (ci\(debug\)|chore: 数据目录)' || true)
          CHANGES=$(echo "$CHANGES" | head -20)

          {
            cat <<'HEAD'
          ## 📦 下载哪个文件？

          | 平台 | 文件 | 说明 |
          |---|---|---|
          | **Windows 10/11（推荐）** | `EvoResearch_0.1.0_x64-setup.exe` | 安装包，下载后双击安装。**大多数用户选这个** |
          | macOS (Apple Silicon) | `EvoResearch_0.1.0_aarch64.dmg` | M1/M2/M3/M4 芯片的 Mac |
          | Linux x86_64（免安装） | `EvoResearch_0.1.0_amd64.AppImage` | `chmod +x` 后直接运行 |
          | Linux x86_64 (Debian/Ubuntu) | `EvoResearch_0.1.0_amd64.deb` | `sudo dpkg -i <文件>` 安装 |
          | Android arm64 | `app-arm64-release.apk` | 大多数现代安卓手机；当前为预览壳（无完整后端） |
          | Android 其它架构 | `app-arm / app-x86 / app-x86_64-release.apk` | 按设备架构选择 |

          > 💡 不确定选哪个？Windows 用户选第一个；Mac 选 aarch64.dmg；
          > Android 安装 unsigned 包需在系统设置中允许"未知来源应用"。

          ## ✨ 本版本亮点

          EvoResearch 是面向科研的自主智能体工作台（基于 deepseek-harness）。
          本构建包含：科研记忆与项目工作区、多智能体团队协作、实验控制台
          （账本/回合/日报）、定时任务、多通道接入、自定义工作台界面，
          以及 **Windows / Linux / macOS 三平台桌面版**。

          ## 📝 近期变更

          HEAD
            if [ -n "$CHANGES" ]; then echo "$CHANGES"; else echo "（本次为首次发布，无历史变更可列）"; fi
            echo ""
            echo "---"
            echo "完整文档见仓库 README · 反馈请提 Issue"
          } > release-notes.md

          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            -F body=@release-notes.md --jq '.html_url'
          echo "===== Release Notes 预览 ====="
          cat release-notes.md
