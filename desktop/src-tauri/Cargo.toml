[package]
name = "evoscientist-desktop"
version = "0.1.0-rc.1"
description = "EvoScientist Windows 桌面壳（WebView2 + Node sidecar）"
authors = ["EvoScientist TS 项目组"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# 体积优化：与「最小打包体积」目标对齐
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
