# EvoResearch 示例 profile 的本地补丁层。
# 与 dsh 部署约定一致：bundles 之后应用本文件，最后是 --patch overlays。
# 默认无需修改；如需覆盖 evoresearch 插件配置，可在此按 id 重写：
#
# - id: evoresearch-host
#   config:
#     dataRoot: D:\evoresearch

# §21.3/§10.6：官方 dsh-base 默认不含 ask_user 工具行——补挂 tool-ask-user，
# 使主 Agent 获得 ask_user_question 工具（模型主动提问 → 工作台问题卡片作答，
# 科研代码模式 Lite/More Effort 选择依赖它）。
- insert:
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'
