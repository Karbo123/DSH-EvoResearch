# EvoResearch DSH 插件 bundle patch。
#
# 作为 profile bundle 挂载（package.json 的 dsh.profile.bundles 加入本包后）：
# - EVORESEARCH-host：Host 插件（科研项目工作区 / EvoMemory v2/v3 / 定时任务 / 通道 / AutoSkills / 专家 / 命令 / Remote API）；
# - EVORESEARCH-client：浏览器端插件（侧栏「科研」入口、科研面板、会话记忆提示条），
#   由 dsh-client-modules 扫描 dsh.client 声明纳入 window.__DSH_BOOT__。
#
# 依赖的 host 服务（dsh-base 提供）：session、commands、tools、systemPrompt、llm、
# agentDefaultModel、settings、skills、agents、timer、sessionQuery。
- insert:
    - id: EVORESEARCH-host
      name: '@evoresearch/dsh-plugin/host'

    # client 行指向包的 node half（根导出）；浏览器 half 由 dsh-client-modules
    # 经 package.json 的 dsh.client 声明读取 exports["./client"]。
    - id: EVORESEARCH-client
      name: '@evoresearch/dsh-plugin'
